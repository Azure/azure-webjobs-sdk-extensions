trigger:
  batch: true
  branches:
    include:
    - dev
    - release/*

  # Not auto triggering for these as can't auto-enable 'sign: true' parameter. Needs a manual queue.
  # tags:
  #   include:
  #   - v*
  #   - '*-v*'

schedules:
# Ensure we build nightly to catch any new CVEs and report SDL often.
- cron: "0 3 * * *"
  displayName: Nightly Build
  branches:
    include:
    - dev
  always: true

# CI only, does not trigger on PRs.
pr: none

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  - repository: eng
    type: git
    name: engineering
    ref: refs/tags/release

variables:
- template: /ci/variables/cfs.yml@eng

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows
      ${{ if eq( variables['Build.Reason'], 'Schedule' ) }}:
        demands:
        - Priority -equals Low

    sdl:
      codeql:
        # Move codeql for source languages to source analysis stage
        runSourceLanguagesInSourceAnalysis: true

    stages:
    - stage: Build
      jobs:
      - template: /eng/ci/templates/jobs/build.yml@self
        parameters:
          sign: false
          projects: $(Build.SourcesDirectory)/WebJobs.Extensions.sln

      - template: /eng/ci/templates/jobs/build.yml@self
        parameters:
          sign: false
          projects: $(Build.SourcesDirectory)/eng/sln/WebJobs.Extensions.Preview.proj
          label: preview
