parameters:
- name: sign
  type: boolean
  default: false
- name: projects
  type: string
- name: build_args
  type: string
  default: ''

jobs:
- job: build
  displayName: Build

  variables:
  - template: /eng/ci/templates/variables/build.yml@self
  - name: pack_dir
    readonly: true
    value: $(Build.ArtifactStagingDirectory)/pkg
  - name: build_args
    readonly: true
    ${{ if eq(parameters.sign, true) }}:
      value: -p:IsReleaseCI=true ${{ parameters.build_args }}
    ${{ else }}:
      value: ${{ parameters.build_args }}

  templateContext:
    outputParentDirectory: $(Build.ArtifactStagingDirectory)
    outputs:
    - output: pipelineArtifact
      displayName: Publish logs
      path: $(pack_dir)
      artifact: drop_packages

  steps:
    - template: /eng/ci/templates/steps/install-dotnet.yml@self

    # If sign=true, verify this is a valid branch or tag
    - ${{ if eq(parameters.sign, true) }}:
      - pwsh: |
          $source = "$(Build.SourceBranch)"
          if (!($source -like "refs/tags/*-v*" || $source -like "refs/tags/v*" || $source -like "refs/heads/release/*"))
          {
            Write-Host "##vso[task.logissue type=error]Signing is not allowed on non-release branches or tags"
            exit 1
          }
        displayName: Verify sign is allowed

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: custom
        custom: restore
        projects: ${{ parameters.projects }}
        arguments: -v m

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: ${{ parameters.projects }}
        arguments: -c $(configuration) -v m --no-restore $(build_args)

    - template: /eng/ci/templates/steps/start-emulators.yml@self

    - task: DotNetCoreCLI@2
      displayName: Unit tests
      inputs:
        command: test
        arguments: -c $(configuration) --no-build
        projects: ${{ parameters.projects }}
      env:
        AzureWebJobsStorage: $(Storage)
        AzureWebJobsDashboard: $(Storage)
        AzureWebJobsCosmosDBConnectionString: $(CosmosDB)
        ConnectionStrings__CosmosDB: $(CosmosDB)

    - ${{ if eq(parameters.sign, true) }}:
      - template: ci/sign-files.yml@eng
        parameters:
          displayName: Sign assemblies
          minimatch: true
          signType: dll-strong-name
          folderPath: out/bin/src
          pattern: |
            **/Microsoft.Azure.WebJobs.Extensions*.dll

    - task: DotNetCoreCLI@2
      displayName: Pack
      inputs:
        command: custom
        custom: pack
        arguments: -c $(configuration) -v m -o $(pack_dir) --no-build
        projects: ${{ parameters.projects }}

    - ${{ if eq(parameters.sign, true) }}:
      - template: ci/sign-files.yml@eng
        parameters:
          displayName: Sign nuget packages
          signType: nuget
          folderPath: $(pack_dir)
          pattern: Microsoft.Azure.WebJobs.Extensions*.nupkg

      - task: DeleteFiles@1
        displayName: Delete CodeSignSummary files
        inputs:
          contents: $(pack_dir)/CodeSignSummary-*.md
